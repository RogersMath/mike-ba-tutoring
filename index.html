<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mike Ba Tutoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-default" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: full-width brand-colored hero with a pattern, then one calm reading column. Brands swap tokens only; layout never changes. */
:root {
  --l-bg: #F3F5FA; --l-surface: #FFFFFF; --l-ink: #141B3A; --l-hero: #1B2566; --l-hero-ink: #F3F5FA; --l-accent: #E3A41C; --l-on-accent: #141B3A; --l-accent-text: #7A4F00;
  --d-bg: #0D1230; --d-surface: #151C45; --d-ink: #E9ECF8; --d-hero: #172060; --d-hero-ink: #F3F5FA; --d-accent: #F0B43A; --d-on-accent: #101635; --d-accent-text: #F0B43A;
  --bg: var(--l-bg); --surface: var(--l-surface); --ink: var(--l-ink); --hero: var(--l-hero); --hero-ink: var(--l-hero-ink);
  --accent: var(--l-accent); --on-accent: var(--l-on-accent); --accent-text: var(--l-accent-text);
  --muted: color-mix(in srgb, var(--ink) 70%, var(--bg));
  --line: color-mix(in srgb, var(--ink) 16%, var(--bg));
  --soft: color-mix(in srgb, var(--ink) 7%, var(--bg));
  --hero-muted: color-mix(in srgb, var(--hero-ink) 74%, var(--hero));
  --pat: color-mix(in srgb, var(--hero-ink) 11%, transparent);
  --r: 4px; --r-card: 4px;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --h-w: 800; --h3-w: 600; --h-ls: -0.02em;
  --pat-img: radial-gradient(circle, var(--pat) 2px, transparent 2.6px), radial-gradient(circle, var(--pat) 2px, transparent 2.6px);
  --pat-size: 26px 26px; --pat-pos: 0 0, 13px 13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--d-bg); --surface: var(--d-surface); --ink: var(--d-ink); --hero: var(--d-hero); --hero-ink: var(--d-hero-ink);
    --accent: var(--d-accent); --on-accent: var(--d-on-accent); --accent-text: var(--d-accent-text); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: var(--d-bg); --surface: var(--d-surface); --ink: var(--d-ink); --hero: var(--d-hero); --hero-ink: var(--d-hero-ink);
  --accent: var(--d-accent); --on-accent: var(--d-on-accent); --accent-text: var(--d-accent-text); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.6; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(1.7rem, 3.6vw, 2.5rem); font-weight: var(--h-w); letter-spacing: var(--h-ls); }
h3 { font-size: 1.25rem; font-weight: var(--h3-w); }
p { margin: 0; }
.wrap { max-width: 1080px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 700px) { .wrap { padding-inline: 32px; } }
.label { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hero); color: var(--hero-ink); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: var(--h-w); font-size: 1.15rem; text-decoration: none; letter-spacing: var(--h-ls); }
.brand svg { width: 30px; height: 30px; flex: none; }
.bar nav { display: flex; gap: 18px; font-size: 0.95rem; }
.bar nav a { text-decoration: none; color: var(--hero-muted); }
.bar nav a:hover { color: var(--hero-ink); }
@media (max-width: 900px) { .bar nav { display: none; } }
.ctl { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1.5px solid var(--hero-muted); border-radius: var(--r); overflow: hidden; }
.seg button { font: 700 0.9rem var(--f-body); min-height: 44px; min-width: 44px; padding: 0 10px; background: transparent; color: var(--hero-ink); border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.bar select { font: 700 0.9rem var(--f-body); min-height: 44px; max-width: 150px; padding: 0 8px; background: var(--hero); color: var(--hero-ink); border: 1.5px solid var(--hero-muted); border-radius: var(--r); }

.hero { background-color: var(--hero); color: var(--hero-ink); background-image: var(--pat-img); background-size: var(--pat-size); background-position: var(--pat-pos); padding-block: clamp(40px, 7vw, 88px) clamp(32px, 5vw, 56px); }
.hero h1 { font-size: clamp(2.3rem, 6.4vw, 4.4rem); font-weight: var(--h-w); letter-spacing: var(--h-ls); max-width: 16ch; }
.hero .lead { font-size: clamp(1.1rem, 2.2vw, 1.35rem); color: var(--hero-muted); max-width: 46ch; margin-top: 20px; }
.hero .label { color: var(--accent); display: block; margin-bottom: 16px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; font: 700 1rem var(--f-body); text-decoration: none; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; border-radius: var(--r); }
.btn.ghost { background: transparent; color: var(--hero-ink); border-color: var(--hero-muted); }
.btn:hover { filter: brightness(1.06); }
.btn.small { min-height: 44px; padding: 0 16px; font-size: 0.92rem; background: transparent; color: var(--ink); border-color: var(--ink); }
.langs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; padding: 0; list-style: none; }
.langs li { padding: 5px 12px; border: 1px solid var(--hero-muted); font-size: 0.9rem; border-radius: 99px; }
.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 40px 0 0; padding: 0; list-style: none; }
@media (min-width: 820px) { .weeks { grid-template-columns: repeat(8, 1fr); } }
.weeks li { padding: 10px 10px 12px; border-top: 3px solid var(--hero-muted); background: color-mix(in srgb, var(--hero-ink) 8%, transparent); min-width: 0; }
.weeks b { display: block; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hero-muted); }
.weeks span { display: block; font-size: 0.95rem; line-height: 1.25; margin-top: 4px; overflow-wrap: anywhere; }
.weeks li.goal { border-top-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.weeks li.goal b { color: var(--accent); }
.weeks-note { margin-top: 12px; font-size: 0.9rem; color: var(--hero-muted); }

section { padding-block: clamp(40px, 6vw, 72px); }
.alt { background: var(--soft); }
.head { display: grid; gap: 10px; margin-bottom: 28px; max-width: 62ch; }
.head p { color: var(--muted); }
.offers { border-top: 2px solid var(--ink); }
.offer { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-bottom: 1px solid var(--line); }
@media (min-width: 760px) { .offer { grid-template-columns: 5fr 7fr; gap: 32px; } }
.offer p { color: var(--muted); max-width: 58ch; }
.why { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .why { grid-template-columns: repeat(3, 1fr); } }
.why > div { min-width: 0; border-left: 4px solid var(--accent); padding-left: 16px; }
.why p { color: var(--muted); margin-top: 6px; }

/* brand studio */
.pick { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 32px; }
@media (min-width: 640px) { .pick { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 980px) { .pick { grid-template-columns: repeat(5, 1fr); } }
.pick button { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-card); padding: 0 0 12px; cursor: pointer; display: grid; gap: 6px; min-width: 0; overflow: hidden; }
.pick button[aria-pressed="true"] { border-color: var(--accent-text); box-shadow: 0 0 0 2px var(--accent-text); }
.pick .strip { display: flex; height: 36px; }
.pick .strip i { flex: 1; display: block; }
.pick b { font-family: var(--f-display); font-size: 1.1rem; padding: 0 12px; }
.pick small { padding: 0 12px; color: var(--muted); font-size: 0.9rem; line-height: 1.35; }
.guide { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .guide { grid-template-columns: 1fr 1fr; } }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.gcard.wide { grid-column: 1 / -1; }
.gcard h3 { font-size: 1.1rem; }
.gcard ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.logo-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo-row svg { width: 72px; height: 72px; color: var(--accent-text); }
.logo-word { font-family: var(--f-display); font-weight: var(--h-w); font-size: 2rem; letter-spacing: var(--h-ls); line-height: 1; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.chip { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; background: var(--bg); }
.chip i { display: block; height: 48px; }
.chip div { padding: 6px 10px 8px; font-size: 0.85rem; line-height: 1.35; }
.chip b { display: block; font-size: 0.92rem; }
.specimen { border-top: 1px solid var(--line); padding-top: 10px; }
.specimen .big { font-family: var(--f-display); font-weight: var(--h-w); font-size: 2rem; letter-spacing: var(--h-ls); line-height: 1.1; }
.dd { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 560px) { .dd { grid-template-columns: 1fr 1fr; } }
.dd h4, .gcard h4 { margin: 0 0 6px; font-size: 0.8125rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); }
.tag { display: inline-block; padding: 2px 10px; border: 1px solid var(--accent-text); border-radius: 99px; font-size: 0.85rem; margin: 0 6px 6px 0; }
.src { margin-top: 28px; display: grid; gap: 8px; }
.src ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.src small { color: var(--muted); }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 18px; margin-bottom: 28px; display: grid; gap: 10px; }
.progress .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 700; }
.meter { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.progress small { color: var(--muted); font-size: 0.9rem; }
.phase { display: grid; gap: 16px; grid-template-columns: 1fr; padding-block: 28px; border-top: 1px solid var(--line); }
@media (min-width: 900px) { .phase { grid-template-columns: 4fr 8fr; gap: 40px; } }
.phase .when { font-family: var(--f-display); font-size: 0.95rem; font-weight: 800; color: var(--accent-text); letter-spacing: 0.04em; text-transform: uppercase; }
.phase h3 { font-size: clamp(1.5rem, 3vw, 2rem); margin: 6px 0 8px; }
.phase .goal { color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; min-width: 0; }
.steps label { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; align-items: start; }
.steps label:hover { border-color: var(--accent-text); }
.steps input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent-text); }
.steps input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.done { margin-top: 12px; padding: 12px 14px; background: var(--soft); border-radius: var(--r); font-weight: 700; }
.done em { font-style: normal; color: var(--accent-text); }
.checks { display: grid; gap: 14px; grid-template-columns: 1fr; margin-top: 8px; }
@media (min-width: 760px) { .checks { grid-template-columns: 1fr 1fr; } }
.check { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: var(--r-card); padding: 18px; min-width: 0; }
.check ul { margin: 10px 0 0; padding-left: 20px; }
.check li { margin-bottom: 4px; }

.tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.group-title { margin: 36px 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.group-title span { font-size: 0.9rem; color: var(--muted); }
details.fix { border-bottom: 1px solid var(--line); }
details.fix summary { list-style: none; cursor: pointer; padding: 16px 40px 16px 0; position: relative; display: grid; gap: 2px; min-height: 48px; }
details.fix summary::-webkit-details-marker { display: none; }
details.fix summary::after { content: "+"; position: absolute; right: 6px; top: 12px; font: 400 1.8rem/1 var(--f-body); color: var(--accent-text); transition: transform 0.2s; }
details.fix[open] summary::after { transform: rotate(45deg); }
details.fix summary b { font-family: var(--f-display); font-size: 1.2rem; font-weight: var(--h3-w); }
details.fix summary small { color: var(--muted); font-size: 0.95rem; }
.fix-body { padding: 4px 0 22px; display: grid; gap: 16px; max-width: 70ch; }
.fix-body h4 { margin: 0 0 4px; font-size: 0.8125rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); }
.fix-body ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.fix-body .backup { background: var(--soft); border-radius: var(--r); padding: 12px 14px; }

.prompts { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .prompts { grid-template-columns: 1fr 1fr; } }
.prompt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
.prompt header { padding: 14px 16px 0; }
.prompt header p { color: var(--muted); font-size: 0.95rem; }
.prompt pre { margin: 12px 16px; padding: 12px; background: var(--soft); border-radius: var(--r); white-space: pre-wrap; overflow-wrap: anywhere; font: 0.92rem/1.5 var(--f-body); }
.prompt footer { padding: 0 16px 16px; }

.help { background: var(--hero); color: var(--hero-ink); }
.help .label { color: var(--accent); }
.help .head p { color: var(--hero-muted); }
.help ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .help ul { grid-template-columns: 1fr 1fr; } }
.help li { border-top: 3px solid var(--accent); padding-top: 10px; min-width: 0; }
.help li b { font-family: var(--f-display); font-size: 1.2rem; font-weight: var(--h3-w); display: block; }
.help li span { color: var(--hero-muted); }
.link-slot { margin-top: 32px; padding: 16px 18px; border: 2px dashed var(--hero-muted); border-radius: var(--r); }
.link-slot b { color: var(--accent); }
footer.site { padding-block: 28px 40px; color: var(--muted); font-size: 0.92rem; }
footer.site p { max-width: 70ch; }
[id] { scroll-margin-top: 76px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top"><span id="barMark" aria-hidden="true"></span><span>Mike Ba</span></a>
    <nav aria-label="Sections">
      <a href="#brand" data-i="nav_brand"></a>
      <a href="#plan" data-i="nav_plan"></a>
      <a href="#trouble" data-i="nav_trouble"></a>
      <a href="#help" data-i="nav_help"></a>
    </nav>
    <div class="ctl">
      <select id="brandSel" aria-label="Style"></select>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lEN" aria-pressed="true">EN</button>
        <button type="button" id="lFR" aria-pressed="false">FR</button>
      </div>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <span class="label" data-i="hero_label"></span>
      <h1 data-i="hero_h1"></h1>
      <p class="lead" data-i="hero_lead"></p>
      <div class="cta">
        <a class="btn" href="#plan" data-i="hero_cta1"></a>
        <a class="btn ghost" href="#help" data-i="hero_cta2"></a>
      </div>
      <ul class="langs"><li>English</li><li>Fran&ccedil;ais</li><li>&#1593;&#1585;&#1576;&#1610;</li><li>Wolof</li><li>Pulaar</li></ul>
      <ol class="weeks" id="weeks"></ol>
      <p class="weeks-note" data-i="weeks_note"></p>
    </div>
  </div>

  <section id="offer">
    <div class="wrap">
      <div class="head"><span class="label" data-i="offer_label"></span><h2 data-i="offer_h2"></h2><p data-i="offer_p"></p></div>
      <div class="offers" id="offers"></div>
    </div>
  </section>

  <section class="alt">
    <div class="wrap">
      <div class="head"><span class="label" data-i="why_label"></span><h2 data-i="why_h2"></h2></div>
      <div class="why" id="why"></div>
    </div>
  </section>

  <section id="brand">
    <div class="wrap">
      <div class="head"><span class="label" data-i="brand_label"></span><h2 data-i="brand_h2"></h2><p data-i="brand_p"></p></div>
      <div class="pick" id="pick" role="group"></div>
      <div class="guide" id="guide"></div>
      <div class="src" id="research"></div>
    </div>
  </section>

  <section id="plan" class="alt">
    <div class="wrap">
      <div class="head"><span class="label" data-i="plan_label"></span><h2 data-i="plan_h2"></h2><p data-i="plan_p"></p></div>
      <div class="progress" aria-live="polite">
        <div class="row"><span id="progText"></span><span id="progPct">0%</span></div>
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="meterFill"></i></div>
        <small data-i="prog_note"></small>
      </div>
      <div id="phases"></div>
      <h3 style="margin-top: 36px;" data-i="cp_h"></h3>
      <div class="checks" id="checks"></div>
    </div>
  </section>

  <section id="trouble">
    <div class="wrap">
      <div class="head"><span class="label" data-i="tr_label"></span><h2 data-i="tr_h2"></h2><p data-i="tr_p"></p></div>
      <div class="tools"><span style="color: var(--muted);" id="fixCount"></span><button class="btn small" id="toggleAll" type="button"></button></div>
      <div id="fixes"></div>
    </div>
  </section>

  <section id="ai" class="alt">
    <div class="wrap">
      <div class="head"><span class="label" data-i="ai_label"></span><h2 data-i="ai_h2"></h2><p data-i="ai_p"></p></div>
      <div class="prompts" id="prompts"></div>
    </div>
  </section>

  <section class="help" id="help">
    <div class="wrap">
      <div class="head"><span class="label" data-i="help_label"></span><h2 data-i="help_h2"></h2><p data-i="help_p"></p></div>
      <ul id="helpList"></ul>
      <div class="link-slot"><b data-i="slot_b"></b><br><span data-i="slot_t"></span></div>
    </div>
  </section>
</main>

<footer class="site"><div class="wrap"><p data-i="foot"></p></div></footer>
<script>
function L(en, fr) { return { en: en, fr: fr }; }

var BRANDS = [
{ id: "teranga",
  name: L("Teranga Indigo", "Indigo Teranga"),
  tag: L("Welcoming, trusted, rooted", "Accueillant, fiable, enraciné"),
  idea: L("Teranga is the Wolof word for hospitality. The deep indigo is inspired by hand-dyed cloth across West Africa. Saffron stands for sunlight and for the one thing to click. The dotted band echoes resist-dyed cloth patterns.",
          "Teranga est le mot wolof pour l'hospitalité. L'indigo profond s'inspire des tissus teints à la main en Afrique de l'Ouest. Le safran rappelle le soleil et marque la seule chose sur laquelle cliquer. Les points évoquent les motifs des tissus teints par réserve."),
  l: { bg: "#F3F5FA", surface: "#FFFFFF", ink: "#141B3A", hero: "#1B2566", heroInk: "#F3F5FA", accent: "#E3A41C", onAccent: "#141B3A", accentText: "#7A4F00" },
  d: { bg: "#0D1230", surface: "#151C45", ink: "#E9ECF8", hero: "#172060", heroInk: "#F3F5FA", accent: "#F0B43A", onAccent: "#101635", accentText: "#F0B43A" },
  r: "4px", rc: "4px", hw: 800, h3w: 600, hls: "-0.02em",

  PHASES.forEach(function (p) {
    var row = el("div", "phase"); var left = el("div");
    left.appendChild(el("div", "when", tr(p.when))); left.appendChild(el("h3", "", tr(p.title))); left.appendChild(el("p", "goal", tr(p.goal)));
    var right = el("div"); var ul = el("ul", "steps");
    tr(p.steps).forEach(function (s, i) {
      var id = p.id + "-" + i; var li = el("li"); var lab = el("label"); var cb = document.createElement("input");
      cb.type = "checkbox"; cb.id = "chk-" + id; cb.checked = !!state.checks[id];
      cb.addEventListener("change", function () { state.checks[id] = cb.checked; persist(); updateProgress(); });
      lab.appendChild(cb); lab.appendChild(el("span", "", s)); li.appendChild(lab); ul.appendChild(li);
    });
    right.appendChild(ul);
    var d = el("div", "done"); d.appendChild(el("em", "", T().done_when)); d.appendChild(document.createTextNode(tr(p.done))); right.appendChild(d);
    row.appendChild(left); row.appendChild(right); host.appendChild(row);
  });
  updateProgress();
}

var allOpen = false;
function renderFixes() {
  var host = document.getElementById("fixes");
  var openIds = {}; Array.prototype.forEach.call(host.querySelectorAll("details[open]"), function (d) { openIds[d.id] = true; });
  host.textContent = ""; var n = 0;
  FIXES.forEach(function (g) {
    var gt = el("div", "group-title"); gt.appendChild(el("h3", "", tr(g.group))); gt.appendChild(el("span", "", tr(g.note))); host.appendChild(gt);
    g.items.forEach(function (f) {
      n++; var d = el("details", "fix"); d.id = f.id; if (openIds[f.id] || allOpen) d.open = true;
      var s = el("summary"); s.appendChild(el("b", "", tr(f.title))); s.appendChild(el("small", "", tr(f.sees))); d.appendChild(s);
      var body = el("div", "fix-body");
      var a = el("div"); a.appendChild(el("h4", "", T().h_why)); a.appendChild(el("p", "", tr(f.why))); body.appendChild(a);
      var b = el("div"); b.appendChild(el("h4", "", T().h_do)); var ol = el("ol"); tr(f.steps).forEach(function (x) { ol.appendChild(el("li", "", x)); }); b.appendChild(ol); body.appendChild(b);
      var c = el("div", "backup"); c.appendChild(el("h4", "", T().h_backup)); c.appendChild(el("p", "", tr(f.backup))); body.appendChild(c);
      d.appendChild(body); host.appendChild(d);
    });
  });
  document.getElementById("fixCount").textContent = T().fix_count(n);
  document.getElementById("toggleAll").textContent = allOpen ? T().close_all : T().open_all;
}

function renderPrompts() {
  var host = document.getElementById("prompts"); host.textContent = "";
  PROMPTS.forEach(function (p, i) {
    var card = el("div", "prompt"); var h = el("header"); h.appendChild(el("h3", "", tr(p.title))); h.appendChild(el("p", "", tr(p.note)));
    var pre = el("pre", "", p.text); pre.id = "prompt-" + i; pre.tabIndex = 0;
    var f = el("footer"); var btn = el("button", "btn small", T().copy); btn.type = "button";
    btn.addEventListener("click", function () {
      function fallback() { var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = T().selected; }
      try { navigator.clipboard.writeText(p.text).then(function () { btn.textContent = T().copied; }, fallback); } catch (e) { fallback(); }
      setTimeout(function () { btn.textContent = T().copy; }, 2500);
    });
    f.appendChild(btn); card.appendChild(h); card.appendChild(pre); card.appendChild(f); host.appendChild(card);
  });
}

function renderAll() { renderStatic(); renderBrandUI(); renderPlan(); renderFixes(); renderPrompts(); }
function setLang(l) { state.lang = l; persist(); renderAll(); }

document.getElementById("lEN").addEventListener("click", function () { setLang("en"); });
document.getElementById("lFR").addEventListener("click", function () { setLang("fr"); });
document.getElementById("brandSel").addEventListener("change", function (e) { applyBrand(e.target.value); renderBrandUI(); });
document.getElementById("toggleAll").addEventListener("click", function () {
  allOpen = !allOpen; var list = document.getElementById("fixes").querySelectorAll("details");
  for (var i = 0; i < list.length; i++) list[i].open = allOpen;
  document.getElementById("toggleAll").textContent = allOpen ? T().close_all : T().open_all;
});

applyBrand(state.brand);
renderAll();

</script>
</body>
</html>
